<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LectureNotes — record, transcribe, revise</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root{
    --board:#20362B;
    --board-2:#2A4536;
    --panel:#2E4B3B;
    --panel-line:#3E6350;
    --chalk:#F1EEE1;
    --chalk-dim:#BFC9BC;
    --yellow:#E6BB5E;
    --clay:#C1583E;
    --mint:#84BE9E;
  }
  html,body{ background:var(--board); font-family:'Inter',sans-serif; color:var(--chalk); }
  .font-display{ font-family:'Lora',serif; }
  .chalk-border{
    border:1.5px dashed var(--panel-line);
  }
  .board-texture{
    background-image:
      radial-gradient(ellipse at 20% 20%, rgba(255,255,255,0.03), transparent 40%),
      radial-gradient(ellipse at 80% 70%, rgba(255,255,255,0.025), transparent 45%);
  }
  .pulse-ring{
    animation: pulse-ring 1.6s cubic-bezier(0.4,0,0.6,1) infinite;
  }
  @keyframes pulse-ring{
    0%{ box-shadow:0 0 0 0 rgba(193,88,62,0.55); }
    70%{ box-shadow:0 0 0 18px rgba(193,88,62,0); }
    100%{ box-shadow:0 0 0 0 rgba(193,88,62,0); }
  }
  .scrollbar-thin::-webkit-scrollbar{ width:6px; }
  .scrollbar-thin::-webkit-scrollbar-thumb{ background:var(--panel-line); border-radius:4px; }
  .fade-in{ animation: fadeIn 0.4s ease both; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
</style>
</head>
<body class="board-texture min-h-screen">

  <div class="max-w-5xl mx-auto px-6 py-10">

    <!-- Header -->
    <header class="flex items-start justify-between mb-10">
      <div>
        <p class="text-[13px] tracking-wide text-[var(--mint)] mb-1">Study companion for lecture halls</p>
        <h1 class="font-display text-4xl font-semibold text-[var(--chalk)]">LectureNotes</h1>
      </div>
      <div class="text-right text-xs text-[var(--chalk-dim)] pt-1">
        <p id="backend-status">checking backend…</p>
      </div>
    </header>

    <!-- Recording panel -->
    <section class="chalk-border rounded-xl p-8 mb-8" style="background:var(--panel)">
      <div class="flex flex-col md:flex-row items-center gap-8">

        <!-- Record button -->
        <div class="flex flex-col items-center gap-3 shrink-0">
          <button id="recordBtn"
            class="relative w-24 h-24 rounded-full flex items-center justify-center transition-all duration-200"
            style="background:var(--clay);">
            <span id="recordIcon" class="block w-7 h-7 rounded-full bg-[var(--chalk)]"></span>
          </button>
          <p id="recordLabel" class="text-sm text-[var(--chalk-dim)]">Start recording</p>
          <p id="timer" class="font-display text-lg tabular-nums text-[var(--chalk)] hidden">00:00</p>
        </div>

        <!-- Visualizer -->
        <div class="flex-1 w-full">
          <div id="vizWrap" class="h-24 rounded-lg chalk-border flex items-center justify-center px-4" style="background:var(--board-2)">
            <p id="vizIdle" class="text-sm text-[var(--chalk-dim)]">Microphone is idle — press the button to begin capturing the lecture.</p>
            <canvas id="viz" class="hidden w-full h-16"></canvas>
          </div>
          <div class="flex items-center justify-between mt-4">
            <p id="statusText" class="text-sm text-[var(--chalk-dim)]">Ready</p>
            <button id="generateBtn" disabled
              class="font-display text-sm px-5 py-2.5 rounded-lg border border-[var(--panel-line)] text-[var(--chalk-dim)] cursor-not-allowed transition-colors">
              Generate class notes
            </button>
          </div>
        </div>
      </div>
    </section>

    <!-- Error banner -->
    <div id="errorBanner" class="hidden chalk-border rounded-lg px-4 py-3 mb-8 text-sm" style="background:rgba(193,88,62,0.12); border-color:var(--clay); color:#F3C9BC;"></div>

    <!-- Results -->
    <section id="results" class="hidden fade-in">
      <h2 id="lectureTitle" class="font-display text-2xl font-semibold mb-6 text-[var(--chalk)]"></h2>

      <div class="grid md:grid-cols-3 gap-6">
        <!-- Topics -->
        <div class="md:col-span-2 space-y-4">
          <h3 class="text-xs tracking-wide text-[var(--mint)] mb-2">Core topics</h3>
          <div id="topicsList" class="space-y-4"></div>
        </div>

        <!-- Sidebar: takeaways + exam questions -->
        <div class="space-y-6">
          <div class="chalk-border rounded-xl p-5" style="background:var(--panel)">
            <h3 class="text-xs tracking-wide text-[var(--yellow)] mb-3">Key takeaways</h3>
            <ul id="takeawaysList" class="space-y-2 text-sm text-[var(--chalk)] leading-relaxed"></ul>
          </div>

          <div>
            <h3 class="text-xs tracking-wide text-[var(--yellow)] mb-3">Predicted exam questions</h3>
            <div id="questionsList" class="space-y-3"></div>
          </div>
        </div>
      </div>
    </section>

  </div>

<script>
// Relative — works whether you open this via the FastAPI server (recommended,
// see README) or override it below if you're serving the frontend separately.
const API_BASE = "";

let mediaRecorder, audioChunks = [], audioBlob = null;
let audioCtx, analyser, sourceNode, vizRAF;
let recording = false, timerInterval, elapsedSeconds = 0;

const recordBtn = document.getElementById('recordBtn');
const recordIcon = document.getElementById('recordIcon');
const recordLabel = document.getElementById('recordLabel');
const timerEl = document.getElementById('timer');
const statusText = document.getElementById('statusText');
const generateBtn = document.getElementById('generateBtn');
const vizIdle = document.getElementById('vizIdle');
const vizCanvas = document.getElementById('viz');
const errorBanner = document.getElementById('errorBanner');

// --- Backend health check -----------------------------------------------
fetch(`${API_BASE}/api/health`).then(r => r.json()).then(d => {
  document.getElementById('backend-status').textContent = d.gemini_configured
    ? "Backend connected" : "Backend connected — GEMINI_API_KEY missing";
}).catch(() => {
  document.getElementById('backend-status').textContent = "Backend unreachable — visit this page at http://localhost:8000";
});

function showError(msg){
  errorBanner.textContent = msg;
  errorBanner.classList.remove('hidden');
}
function clearError(){ errorBanner.classList.add('hidden'); }

// --- Recording ------------------------------------------------------------
recordBtn.addEventListener('click', async () => {
  if (!recording) await startRecording(); else stopRecording();
});

async function startRecording(){
  clearError();
  try{
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });

    audioChunks = [];
    mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm' });
    mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
    mediaRecorder.onstop = () => {
      audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
      stream.getTracks().forEach(t => t.stop());
      generateBtn.disabled = false;
      generateBtn.classList.remove('cursor-not-allowed', 'text-[var(--chalk-dim)]');
      generateBtn.classList.add('bg-[var(--mint)]', 'text-[var(--board)]', 'border-[var(--mint)]');
      statusText.textContent = `Captured ${formatTime(elapsedSeconds)} of audio — ready to generate notes.`;
    };
    mediaRecorder.start();

    setupVisualizer(stream);

    recording = true;
    elapsedSeconds = 0;
    timerEl.textContent = '00:00';
    timerEl.classList.remove('hidden');
    timerInterval = setInterval(() => {
      elapsedSeconds++;
      timerEl.textContent = formatTime(elapsedSeconds);
    }, 1000);

    recordBtn.style.background = 'var(--yellow)';
    recordBtn.classList.add('pulse-ring');
    recordIcon.classList.remove('rounded-full');
    recordIcon.classList.add('rounded-sm');
    recordLabel.textContent = 'Stop recording';
    statusText.textContent = 'Recording lecture…';
    vizIdle.classList.add('hidden');
    vizCanvas.classList.remove('hidden');

  } catch(err){
    showError("Couldn't access the microphone. Check your browser permissions and try again.");
  }
}

function stopRecording(){
  if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
  recording = false;
  clearInterval(timerInterval);
  cancelAnimationFrame(vizRAF);
  if (audioCtx) audioCtx.close();

  recordBtn.style.background = 'var(--clay)';
  recordBtn.classList.remove('pulse-ring');
  recordIcon.classList.add('rounded-full');
  recordIcon.classList.remove('rounded-sm');
  recordLabel.textContent = 'Start recording';
  vizIdle.classList.remove('hidden');
  vizCanvas.classList.add('hidden');
}

function formatTime(s){
  const m = Math.floor(s/60).toString().padStart(2,'0');
  const sec = (s%60).toString().padStart(2,'0');
  return `${m}:${sec}`;
}

// --- Visualizer -------------------------------------------------------
function setupVisualizer(stream){
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 128;
  sourceNode = audioCtx.createMediaStreamSource(stream);
  sourceNode.connect(analyser);

  const ctx = vizCanvas.getContext('2d');
  const bufferLength = analyser.frequencyBinCount;
  const dataArray = new Uint8Array(bufferLength);

  function draw(){
    vizRAF = requestAnimationFrame(draw);
    const rect = vizCanvas.getBoundingClientRect();
    vizCanvas.width = rect.width; vizCanvas.height = rect.height;
    analyser.getByteFrequencyData(dataArray);
    ctx.clearRect(0,0,vizCanvas.width, vizCanvas.height);

    const barCount = 40;
    const step = Math.floor(bufferLength / barCount);
    const barWidth = vizCanvas.width / barCount;

    for(let i=0;i<barCount;i++){
      const value = dataArray[i*step] || 0;
      const barHeight = Math.max(3, (value/255) * vizCanvas.height);
      ctx.fillStyle = i % 4 === 0 ? '#E6BB5E' : '#84BE9E';
      ctx.fillRect(i*barWidth + barWidth*0.25, (vizCanvas.height-barHeight)/2, barWidth*0.5, barHeight);
    }
  }
  draw();
}

// --- Generate notes -----------------------------------------------------
generateBtn.addEventListener('click', async () => {
  if (!audioBlob) return;
  clearError();
  generateBtn.disabled = true;
  generateBtn.textContent = 'Analyzing lecture…';
  statusText.textContent = 'Uploading audio and generating notes — this can take a minute.';

  const formData = new FormData();
  formData.append('audio', audioBlob, 'lecture.webm');

  try{
    const res = await fetch(`${API_BASE}/api/generate-notes`, { method: 'POST', body: formData });
    if (!res.ok){
      const err = await res.json().catch(() => ({}));
      throw new Error(err.detail || `Server responded with ${res.status}`);
    }
    const notes = await res.json();
    renderNotes(notes);
    statusText.textContent = 'Notes generated.';
  } catch(err){
    const msg = err instanceof TypeError
      ? "Can't reach the backend. Make sure the FastAPI server is running (uvicorn main:app --port 8000) and that you're viewing this page at http://localhost:8000."
      : err.message;
    showError(`Couldn't generate notes: ${msg}`);
    statusText.textContent = 'Something went wrong — try again.';
  } finally {
    generateBtn.disabled = false;
    generateBtn.textContent = 'Generate class notes';
  }
});

function renderNotes(notes){
  document.getElementById('lectureTitle').textContent = notes.lecture_title || 'Lecture notes';

  const topicsList = document.getElementById('topicsList');
  topicsList.innerHTML = '';
  (notes.topics || []).forEach(topic => {
    const card = document.createElement('div');
    card.className = 'chalk-border rounded-xl p-5';
    card.style.background = 'var(--panel)';
    card.innerHTML = `
      <h4 class="font-display text-lg font-semibold text-[var(--chalk)] mb-1.5">${escapeHtml(topic.heading)}</h4>
      <p class="text-sm text-[var(--chalk-dim)] mb-3 leading-relaxed">${escapeHtml(topic.summary)}</p>
      ${(topic.subtopics||[]).map(st => `
        <div class="mt-3 pl-4 border-l-2" style="border-color:var(--panel-line)">
          <p class="text-sm font-medium text-[var(--mint)] mb-1">${escapeHtml(st.heading)}</p>
          <ul class="list-disc list-inside space-y-1 text-sm text-[var(--chalk)]">
            ${(st.points||[]).map(p => `<li>${escapeHtml(p)}</li>`).join('')}
          </ul>
        </div>
      `).join('')}
    `;
    topicsList.appendChild(card);
  });

  const takeawaysList = document.getElementById('takeawaysList');
  takeawaysList.innerHTML = (notes.key_takeaways || []).map(t => `
    <li class="flex gap-2"><span style="color:var(--yellow)">•</span><span>${escapeHtml(t)}</span></li>
  `).join('');

  const questionsList = document.getElementById('questionsList');
  questionsList.innerHTML = (notes.exam_questions || []).map(q => `
    <div class="chalk-border rounded-lg p-4" style="background:var(--panel)">
      <span class="inline-block text-[11px] px-2 py-0.5 rounded mb-2" style="background:rgba(230,187,94,0.15); color:var(--yellow)">${escapeHtml(q.type)}</span>
      <p class="text-sm text-[var(--chalk)] font-medium mb-2">${escapeHtml(q.question)}</p>
      ${q.options ? `<ul class="text-xs text-[var(--chalk-dim)] space-y-1 mb-2">${q.options.map((o,i)=>`<li>${String.fromCharCode(65+i)}. ${escapeHtml(o)}</li>`).join('')}</ul>` : ''}
      <p class="text-xs text-[var(--chalk-dim)] italic">Hint: ${escapeHtml(q.answer_hint)}</p>
    </div>
  `).join('');

  document.getElementById('results').classList.remove('hidden');
  document.getElementById('results').scrollIntoView({ behavior: 'smooth' });
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str ?? '';
  return div.innerHTML;
}
</script>
</body>
</html>
